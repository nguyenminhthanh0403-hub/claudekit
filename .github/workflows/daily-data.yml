name: Daily Bullion Data Update

# Runs the live-data fetch every morning and commits an updated data.json.
# GitHub cron is UTC only (no daylight-saving handling), so 10:07 UTC is
# ~6am America/New_York during EDT (summer) and ~5am during EST (winter).
# The exact minute is offset off :00 because GitHub delays jobs scheduled on
# the hour under load. workflow_dispatch lets you run it by hand to test.
on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push the data.json commit back to main and
# manage the pipeline-alarm issue below. No new secret — see the design doc:
# SMTP was rejected because it would need credentials in a repo secret,
# reintroducing the exact silent-bad-secret failure class this workflow
# already caused once (docs/superpowers/bullion-live-data-pipeline-outage-handoff.md).
permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provision FRED API key from secret
        # The secret was created as FRED but this step read FRED_API_KEY, so it
        # resolved to empty and every scheduled run from 2026-07-20 to
        # 2026-08-04 died here — the pipeline never once published. A secret
        # name is invisible from the code side and unset secrets expand to ""
        # rather than erroring, so accept either name instead of depending on
        # the two spellings being kept in sync by hand.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "Neither the FRED_API_KEY nor the FRED secret is set. Add one under" >&2
            echo "Settings -> Secrets and variables -> Actions -> New repository secret." >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/bullion"
          printf '%s\n' "$FRED_API_KEY" > "$HOME/.config/bullion/fred_api_key"

      - name: Fetch live financial data
        run: exit 1 # TEMPORARY — deliberate failure for pipeline-alarm live-fire test, reverted in the same session

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bullion-live-map/data.json
          if git diff --cached --quiet; then
            echo "No data changes today; nothing to commit."
          else
            git commit -m "Update live financial data for $(date -u +%F)"
            git push
          fi

      - name: Ensure the pipeline-alarm label exists
        # always() so this still runs even if an earlier step in this job
        # failed — the failure-report step below depends on the label
        # already existing to filter its issue search correctly.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'pipeline-alarm',
                color: 'd93f0b',
                description: 'Daily data fetch workflow is failing',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = label already exists
            }

      - name: Report failure to the alarm issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: jobsResponse } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failedStep = jobsResponse.jobs
              .flatMap(j => j.steps || [])
              .find(s => s.conclusion === 'failure');
            const stepName = failedStep ? failedStep.name : 'unknown step';
            const today = new Date().toISOString().slice(0, 10);
            const body = `**${today}** — failing step: **${stepName}**\nRun: ${runUrl}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-alarm',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Daily data fetch is failing',
                body,
                labels: ['pipeline-alarm'],
                assignees: [context.repo.owner],
              });
            } else {
              // Each failure comments rather than opening a duplicate, so a
              // pipeline that stays broken emails once per day it stays broken.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

      - name: Close the alarm issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pipeline-alarm',
            });
            const today = new Date().toISOString().slice(0, 10);
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — the **${today}** run succeeded.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
